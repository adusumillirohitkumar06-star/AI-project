services:
  # FastAPI Backend Service
  - type: web
    name: ai-airport-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-airport-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: ENABLE_SECURITY_HEADERS
        value: true
      - key: CORS_ORIGINS
        value: '["https://ai-airport-frontend.vercel.app","http://localhost:3000"]'

databases:
  # Managed PostgreSQL Database
  - name: ai-airport-db
    databaseName: airport_production
    user: airport_admin
    region: oregon
    plan: free
